<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>예약 확인 | 탱탱불족발 용호점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--shout:#FFCF1A;--ink:#1C110B;--surface:#2B1B12;--cream:#FFF4DE;--muted:rgba(255,244,222,.66);--line:rgba(255,244,222,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
.top{background:var(--shout);color:var(--ink);border-radius:0 0 100px 32px;padding:28px 0 64px}
.wrap{width:min(560px,100% - 32px);margin:0 auto}
.brand{font-family:"Black Han Sans",sans-serif;font-size:20px}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.03em;margin:40px 0 12px}
.lede{margin:0;font-weight:600;font-size:18px;opacity:.82}
.card{margin-top:-36px;background:rgba(28,17,11,.7);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:32px;padding:24px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
dl{margin:0;display:grid}
.row{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
dt{color:var(--muted);font-weight:700;font-size:15px}
dd{margin:0;font-weight:800;font-size:18px}
.policy{margin-top:20px;padding:18px 20px;border-radius:24px;border:1px solid var(--line);color:var(--muted);font-size:15px}
.policy b{color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border-radius:999px;font-weight:800;font-size:17px;text-decoration:none;margin-top:20px;background:var(--shout);color:var(--ink)}
.btn.line{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:6px}
.err{color:#FF8A70;font-weight:700}
a{color:inherit}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">탱탱불족발 용호점</div>
    <h1 id="title">결제를 확인하고 있어요</h1>
    <p class="lede" id="lede">창을 닫지 말고 잠시만 기다려 주세요.</p>
  </div>
</header>
<main class="wrap">
  <div class="card" id="card" hidden>
    <dl>
      <div class="row"><dt>픽업</dt><dd id="pick"></dd></div>
      <div class="row"><dt>메뉴</dt><dd id="menu"></dd></div>
      <div class="row"><dt>결제</dt><dd id="paid"></dd></div>
    </dl>
    <div class="policy">
      <b>취소는 픽업 전날 20시까지</b> 전화로 해 주세요. 전액 환불해요. 픽업 당일에는 그날 만들기 때문에 취소·환불이 어려워요.
    </div>
    <a class="btn" href="tel:01072055570">가게에 전화하기</a><a class="btn line" href="/">처음으로</a>
  </div>
  <div class="card" id="errCard" hidden>
    <p class="err" id="err"></p>
    <p>결제가 됐는지 헷갈리면 가게에 전화해 주세요. <a href="tel:01072055570">010-7205-5570</a></p>
    <a class="btn" href="/#reserve">다시 예약하기</a>
  </div>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const DAYS = ['일','월','화','수','목','금','토'];
  const show = o => {
    const [, m, d] = o.pickup_date.split('-');
    const w = DAYS[new Date(o.pickup_date + 'T00:00:00Z').getUTCDay()];
    $('title').textContent = '예약이 확정됐어요';
    $('lede').textContent = '시간 맞춰 가게로 찾아오세요.';
    $('pick').textContent = `${+m}월 ${+d}일 (${w}) ${o.pickup_time}`;
    $('menu').textContent = o.message;
    $('paid').textContent = `${Number(o.total).toLocaleString('ko-KR')}원${o.method ? ' · ' + o.method : ''}`;
    $('card').hidden = false;
  };
  const fail = msg => { $('title').textContent = '예약을 마치지 못했어요'; $('lede').textContent = ''; $('err').textContent = msg; $('errCard').hidden = false; };
  try {
    const r = await fetch('/api/pay-confirm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey: q.get('paymentKey'), orderId: q.get('orderId'), amount: Number(q.get('amount')) }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || '결제를 확인하지 못했어요.');
    show(data.order);
    history.replaceState(null, '', location.pathname + location.search);
  } catch (e) {
    fail(e.message);
  }
})();
</script>
</body>
</html>
