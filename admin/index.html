<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>예약함 | 탱탱불족발 용호점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--shout:#FFCF1A;--ink:#1C110B;--void:#1C110B;--surface:#2B1B12;--cream:#FFF4DE;--muted:rgba(255,244,222,.66);--line:rgba(255,244,222,.18);--chili:#F0502E}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--cream);font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
.wrap{width:min(720px,100% - 32px);margin:0 auto;padding:24px 0 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:15px}
:focus-visible{outline:3px solid var(--shout);outline-offset:2px}
input[type=password]{width:100%;min-height:56px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--cream);font:600 18px inherit;padding:0 22px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.btn{min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--shout);color:var(--ink);font-weight:800;font-size:17px}
.btn:active{transform:scale(.96)}
.login form{display:grid;gap:12px;margin-top:8px}
.err{color:#FF8A70;font-weight:700;min-height:24px;margin:8px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--cream);min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:700}
.big{background:var(--shout);color:var(--ink);border-radius:28px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.big b{font-size:52px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.big span{font-weight:800;font-size:18px}
.big small{display:block;font-weight:600;font-size:14px;opacity:.75}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--cream);font-size:15px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.list{display:grid;gap:12px}
.card{background:var(--surface);border-radius:24px;padding:18px 18px 16px;border:1px solid transparent}
.card.new{border-color:rgba(255,207,26,.55)}
.pick{font-size:20px;font-weight:900;margin:0 0 2px}
.pick.today{color:var(--shout)}
.order{font-size:17px;font-weight:700;margin:6px 0 2px}
.meta{color:var(--muted);font-size:14px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.who strong{font-size:17px}
.who a,.who button{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--cream);font-size:15px;font-weight:700;text-decoration:none}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status button{min-height:48px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--cream);font-size:15px;font-weight:700}
.status button[aria-pressed=true]{background:var(--shout);color:var(--ink);border-color:var(--shout)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <section class="login" id="login">
    <h1>예약함</h1>
    <p class="sub">탱탱불족발 용호점 사장님 화면이에요.</p>
    <form id="loginForm">
      <label for="pw" class="sub" style="margin:0">관리자 비밀번호</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="btn" type="submit">예약 보기</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <section id="app" hidden>
    <div class="head">
      <div><h1>예약함</h1><p class="sub" style="margin:0" id="updated"></p></div>
      <div style="display:flex;gap:6px"><button class="ghost" id="reload">새로고침</button><button class="ghost" id="logout">나가기</button></div>
    </div>
    <div class="big"><span>새 예약<small>아직 확인 전화를 안 한 예약</small></span><b id="newCount">0</b></div>
    <div class="tabs" role="group" aria-label="상태별 보기">
      <button data-f="새 문의" aria-pressed="true">새 예약</button>
      <button data-f="연락함" aria-pressed="false">확인 전화함</button>
      <button data-f="완료" aria-pressed="false">픽업 완료</button>
      <button data-f="all" aria-pressed="false">전체</button>
    </div>
    <p class="err" id="appErr" role="alert"></p>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(() => {
  const LABEL = { '새 문의': '새 예약', '연락함': '확인 전화함', '완료': '픽업 완료' };
  const KEY = 'tt_admin_pw';
  let rows = [], filter = '새 문의';
  const $ = id => document.getElementById(id);
  const won = n => (n || 0).toLocaleString('ko-KR') + '원';
  const DAYS = ['일','월','화','수','목','금','토'];
  const seoulToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const pickLabel = r => {
    if (!r.pickup_date) return '픽업 날짜 없음';
    const [, m, d] = r.pickup_date.split('-');
    const w = DAYS[new Date(r.pickup_date + 'T00:00:00Z').getUTCDay()];
    const today = r.pickup_date === seoulToday() ? '오늘 ' : '';
    return `${today}${+m}/${+d}(${w}) ${r.pickup_time || ''} 픽업`;
  };
  const when = iso => new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const api = async (method, body) => {
    const r = await fetch('/api/admin', { method, headers: { 'x-admin-password': sessionStorage.getItem(KEY) || '', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { sessionStorage.removeItem(KEY); showLogin('비밀번호가 맞지 않아요.'); throw new Error(''); }
    if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
    return data;
  };

  const showLogin = msg => { $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || ''; $('pw').value = ''; $('pw').focus(); };

  const render = () => {
    $('newCount').textContent = rows.filter(r => r.status === '새 문의').length;
    let shown = filter === 'all' ? rows.slice() : rows.filter(r => r.status === filter);
    const key = r => `${r.pickup_date || ''} ${r.pickup_time || ''}`;
    shown.sort((a, b) => filter === '완료' || filter === 'all' ? key(b).localeCompare(key(a)) : key(a).localeCompare(key(b)));
    const list = $('list');
    list.innerHTML = '';
    if (!shown.length) { list.innerHTML = '<p class="empty">여기에 해당하는 예약이 없어요.</p>'; return; }
    for (const r of shown) {
      const c = document.createElement('article');
      c.className = 'card' + (r.status === '새 문의' ? ' new' : '');
      const pick = document.createElement('p'); pick.className = 'pick' + (r.pickup_date === seoulToday() ? ' today' : ''); pick.textContent = pickLabel(r);
      const order = document.createElement('p'); order.className = 'order'; order.textContent = r.message || '';
      const meta = document.createElement('p'); meta.className = 'meta'; meta.textContent = `예상 ${won(r.total)} · 접수 ${when(r.created_at)}`;
      const who = document.createElement('div'); who.className = 'who';
      const nm = document.createElement('strong'); nm.textContent = r.name;
      const tel = document.createElement('a'); tel.href = 'tel:' + String(r.contact).replace(/[^\d+]/g, ''); tel.textContent = '전화 ' + r.contact;
      const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = '번호 복사';
      copy.onclick = async () => { try { await navigator.clipboard.writeText(r.contact); copy.textContent = '복사됨'; } catch { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(tel); s.removeAllRanges(); s.addRange(rg); } setTimeout(() => copy.textContent = '번호 복사', 1500); };
      who.append(nm, tel, copy);
      const st = document.createElement('div'); st.className = 'status'; st.setAttribute('role', 'group'); st.setAttribute('aria-label', '예약 상태');
      for (const s of Object.keys(LABEL)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = LABEL[s]; b.setAttribute('aria-pressed', String(r.status === s));
        b.onclick = async () => { if (r.status === s) return; b.disabled = true; try { await api('PATCH', { id: r.id, status: s }); await load(); } catch (e) { $('appErr').textContent = e.message; } finally { b.disabled = false; } };
        st.append(b);
      }
      c.append(pick, order, meta, who, st);
      list.append(c);
    }
  };

  const load = async () => {
    $('appErr').textContent = '';
    const data = await api('GET');
    rows = data.rows || [];
    $('login').hidden = true; $('app').hidden = false;
    $('updated').textContent = '마지막 새로고침 ' + new Date().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
    render();
  };

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    sessionStorage.setItem(KEY, $('pw').value);
    try { await load(); } catch (err) { if (err.message) showLogin(err.message); }
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  $('reload').onclick = () => load().catch(e => { if (e.message) $('appErr').textContent = e.message; });
  $('logout').onclick = () => { sessionStorage.removeItem(KEY); rows = []; showLogin(''); };

  if (sessionStorage.getItem(KEY)) load().catch(e => { if (e.message) showLogin(e.message); });
  else $('pw').focus();
})();
</script>
</body>
</html>
